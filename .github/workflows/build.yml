name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib python3-pip mtools
          # unicorn — эмуляция загрузчика и ядра,
          # mtools — независимая реализация FAT16 для сборки образа
          pip install --break-system-packages unicorn

      - name: Build image (boot + kernel + FAT16)
        run: make all

      - name: Run host tests (PMM + FAT16)
        run: make test

      - name: Check image layout (boot / boot2 / kernel offsets)
        run: make layout-check

      - name: Emulate bootloader and kernel end to end
        run: make boottest

      - name: Show image layout
        run: |
          ls -l build/os.img build/boot.bin build/boot2.bin build/kernel.bin
          # загрузчик читает 64 сектора = 32 КиБ ядра
          test "$(stat -c%s build/kernel.bin)" -le 32768
          # FAT16 обязана начинаться не раньше сектора 64
          test "$(stat -c%s build/kernel.bin)" -le $((61 * 512))
