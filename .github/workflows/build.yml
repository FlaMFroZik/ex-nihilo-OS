name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib python3-pip
          # unicorn нужен для эмуляционной проверки загрузчика
          pip install --break-system-packages unicorn

      - name: Build kernel image
        run: make all

      - name: Run PMM host tests
        run: make test

      - name: Check image layout (boot / boot2 / kernel offsets)
        run: make layout-check

      - name: Emulate the bootloader end to end
        run: make boottest

      - name: Show image layout
        run: |
          ls -l build/os.img build/boot.bin build/boot2.bin build/kernel.bin
          # загрузчик читает не больше 32 КиБ ядра
          test "$(stat -c%s build/kernel.bin)" -le 32768
